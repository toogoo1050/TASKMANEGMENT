spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/taskmanagement
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update   # 起動時にテーブルを自動作成・更新（データは消えない）
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080
